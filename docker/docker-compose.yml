# ============================================
# WVP 单机部署：WVP + ZLMediaKit
# WVP 使用 H2 文件数据库和代码内的内存版 Redis，无需 MySQL / Redis
# jar 由 docker/build.sh 在本地构建后引入镜像
# ============================================

services:
  polaris-wvp:
    build:
      context: ..
      dockerfile: ./docker/wvp/Dockerfile
    image: wvp-service:latest
    restart: always
    networks:
      - media-net
    ports:
      - "${WVP_HTTP_PORT:-18978}:18978"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/tcp"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/udp"
      - "${RTP_SEND_RANGE_START:-40001}-${RTP_SEND_RANGE_END:-40500}:${RTP_SEND_RANGE_START:-40001}-${RTP_SEND_RANGE_END:-40500}/tcp"
      - "${RTP_SEND_RANGE_START:-40001}-${RTP_SEND_RANGE_END:-40500}:${RTP_SEND_RANGE_START:-40001}-${RTP_SEND_RANGE_END:-40500}/udp"
    depends_on:
      - polaris-media
    volumes:
      # 配置目录：容器启动时若目录内无配置文件，会把镜像内的默认配置复制到这里
      - ./wvp/config:/config
      # H2 数据库文件、录像索引等持久化数据
      - ./wvp/data:/opt/wvp/data
      - ./logs/wvp:/opt/wvp/logs
      - ./volumes/video:/opt/wvp/www/record
    environment:
      TZ: "Asia/Shanghai"
      # WVP HTTP 端口
      WVP_HTTP_PORT: 18978
      # SIP 监听与展示
      SIP_IP: 0.0.0.0
      SIP_ShowIP: ${SIP_ShowIP:-127.0.0.1}
      SIP_Port: ${SIP_Port:-8116}
      SIP_Domain: ${SIP_Domain:-3502000000}
      SIP_Id: ${SIP_Id:-35020000002000000001}
      SIP_Password: ${SIP_Password:-wvp_sip_password}
      # 播流/SDP 中使用的 IP，外部访问时改成本机对外 IP
      STREAM_IP: ${Stream_IP:-127.0.0.1}
      SDP_IP: ${SDP_IP:-127.0.0.1}
      # ZLM：compose 内直接用服务名互访
      ZLM_ID: ${ZLM_ID:-polaris}
      ZLM_HOST: polaris-media
      ZLM_HOOK_HOST: polaris-wvp
      ZLM_HTTP_PORT: 80
      ZLM_SECRET: ${ZLM_SECRET:-su6TiedN2rVAmBbIDX0aa0QTiBJLBdcf}
      # RTP 收流：false 即单端口模式（ssrc 区分），true 即多端口模式
      RTP_ENABLE: ${RTP_ENABLE:-false}
      # 收流端口范围，仅多端口模式使用
      RTP_RANGE_START: ${RTP_RANGE_START:-30000}
      RTP_RANGE_END: ${RTP_RANGE_END:-30500}
      # 级链发送端口范围，需与 zlm 的 [rtp_proxy] port_range 一致
      RTP_SEND_RANGE_START: ${RTP_SEND_RANGE_START:-40001}
      RTP_SEND_RANGE_END: ${RTP_SEND_RANGE_END:-40500}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+HeapDumpOnOutOfMemoryError}

  polaris-media:
    image: zlmediakit/zlmediakit:master
    restart: always
    networks:
      - media-net
    ports:
      - "${MediaRtmp:-10001}:${MediaRtmp:-10001}/tcp"
      - "${MediaRtmp:-10001}:${MediaRtmp:-10001}/udp"
      - "${MediaRtsp:-10002}:${MediaRtsp:-10002}/tcp"
      - "${MediaRtsp:-10002}:${MediaRtsp:-10002}/udp"
      - "${MediaRtp:-10003}:${MediaRtp:-10003}/tcp"
      - "${MediaRtp:-10003}:${MediaRtp:-10003}/udp"
    volumes:
      - ./media/config.ini:/conf/config.ini
      - ./volumes/video:/opt/media/bin/www/record
      - ./logs/media:/opt/media/log
    command: [
        'MediaServer',
        '-c', '/conf/config.ini',
        '-l', '0'
    ]

networks:
  media-net:
    driver: bridge
