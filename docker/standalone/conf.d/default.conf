server {
    listen 80;
    server_name localhost;

    # Frontend static files
    location / {
        root /opt/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to WVP
    location /api/ {
        proxy_pass http://localhost:18978/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JSON response filtering for media URLs
        sub_filter "http://localhost:18978/index/api/downloadFile" "api/downloadFile";
        sub_filter "http://localhost/index/api/downloadFile" "api/downloadFile";
        sub_filter "http://localhost/mp4_record" "mp4_record";
        sub_filter "http://localhost:18978/mp4_record" "mp4_record";
        sub_filter "ws://localhost/mp4_record" "mp4_record";
        sub_filter "ws://localhost:18978/mp4_record" "mp4_record";
        sub_filter_once off;
        sub_filter_types application/json;
    }

    # ZLM file download proxy
    location /api/downloadFile {
        proxy_pass http://localhost:80/index/api/downloadFile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ZLM RTP streaming proxy
    location ^~ /rtp/ {
        proxy_pass http://localhost:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # ZLM MP4 record proxy
    location ^~ /mp4_record/ {
        proxy_pass http://localhost:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # H5Player (ZLM web player)
    location /h5player/ {
        proxy_pass http://localhost:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
