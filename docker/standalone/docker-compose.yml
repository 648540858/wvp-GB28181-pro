# ============================================
# WVP Standalone Docker Compose
# Single image: WVP + ZLM + Nginx
# No MySQL, No Redis — uses H2 + Caffeine
# ============================================

version: '3'

services:
  polaris-standalone:
    # Option 1: Use pre-built image
    image: wvp-GB28181-pro/standalone:latest
    # Option 2: Build from source (uncomment to build locally)
    # build:
    #   context: ../../        # Project root
    #   dockerfile: ./docker/standalone/Dockerfile

    container_name: polaris-standalone
    restart: unless-stopped

    ports:
      - "${WVP_PORT:-18978}:18978"          # WVP HTTP API
      - "${SIP_PORT:-8116}:${SIP_PORT:-8116}/udp"  # SIP TCP/UDP
      - "${SIP_PORT:-8116}:${SIP_PORT:-8116}/tcp"
      - "${WEB_PORT:-8080}:80"               # Nginx Web Frontend
      - "${RTMP_PORT:-10001}:${RTMP_PORT:-10001}/tcp"   # RTMP
      - "${RTMP_PORT:-10001}:${RTMP_PORT:-10001}/udp"
      - "${RTSP_PORT:-10002}:${RTSP_PORT:-10002}/tcp"   # RTSP
      - "${RTSP_PORT:-10002}:${RTSP_PORT:-10002}/udp"
      - "${RTP_PORT:-10003}:${RTP_PORT:-10003}/tcp"    # RTP Proxy
      - "${RTP_PORT:-10003}:${RTP_PORT:-10003}/udp"
      - "${RTP_RANGE_START:-30000}-${RTP_RANGE_END:-30500}/tcp"  # RTP range
      - "${RTP_RANGE_START:-30000}-${RTP_RANGE_END:-30500}/udp"

    volumes:
      # WVP data (H2 database persistence)
      - ./data/wvp:/opt/wvp/data
      # ZLM configuration and recordings
      - ./data/zlm/config.ini:/opt/media/config.ini:ro
      - ./data/zlm/data:/opt/media/data
      - ./data/zlm/www/record:/opt/media/bin/www/record
      # WVP logs
      - ./logs/wvp:/opt/wvp/logs
      # ZLM logs
      - ./logs/zlm:/opt/media/log
      # FFmpeg logs
      - ./logs/ffmpeg:/opt/media/bin/www/ffmpeg

    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # SIP configuration (defaults from .env if not set)
      SIP_PORT: ${SIP_PORT:-8116}
      SIP_DOMAIN: ${SIP_DOMAIN:-3502000000}
      SIP_ID: ${SIP_ID:-35020000002000000001}
      SIP_PASSWORD: ${SIP_PASSWORD:-wvp_sip_password}
      # WVP HTTP port (should match ports mapping)
      WVP_HTTP_PORT: ${WVP_PORT:-18978}
      # Stream IP (for SDP and media URLs)
      STREAM_IP: ${STREAM_IP:-127.0.0.1}
      SDP_IP: ${SDP_IP:-127.0.0.1}
      # Show IP in SIP messages
      SIP_SHOW_IP: ${SIP_SHOW_IP:-127.0.0.1}
      # Java heap (adjust based on available memory)
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18978/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    # Uncomment for debug access
    # stdin_open: true
    # tty: true

volumes:
  wvp-data:
  zlm-data:
  logs:
