# ============================================
# WVP-GB28181-Pro 一键部署
# wvp : 本项目镜像(H2文件数据库 + 代码内置内存模拟Redis, 无需外部MySQL/Redis)
# zlm : ZLMediaKit 官方镜像(与代码master分支保持最新)
#
# 使用: 修改 .env 后执行  docker compose up -d
# 配置: 首次启动后自动生成 ./config/ 目录(内置默认配置),
#       修改 ./config/ 下文件后 docker compose restart wvp 生效
# ============================================
services:
  wvp:
    # 使用已构建/已推送的镜像(镜像名 = ${DOCKER_HUB_USER}/wvp-GB28181-pro:${VERSION})
    image: ${DOCKER_HUB_USER:-wvp}/wvp-gb28181-pro:${VERSION:-2.7.4}
    # 本地构建镜像: 注释上面的 image, 取消下面注释(需先本地 mvn 编译出 jar)
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: wvp
    restart: unless-stopped
    ports:
      - "${WVP_HTTP_PORT:-18978}:18978"          # Web界面与API
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/udp"  # GB28181信令
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/tcp"
    environment:
      TZ: "Asia/Shanghai"
      # [可选] Java内存参数
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      # [必须修改] 客户端播放流时访问ZLM使用的IP: 局域网填宿主机内网IP, 公网填公网IP
      STREAM_IP: ${STREAM_IP}
      # [必须修改] 设备向服务器推流时使用的IP, 一般与STREAM_IP相同
      SDP_IP: ${SDP_IP}
      # [可选] 前端展示用的IP
      SIP_ShowIP: ${SIP_ShowIP:-127.0.0.1}
      # GB28181服务器配置
      SIP_Port: ${SIP_Port:-8116}
      SIP_Domain: ${SIP_Domain:-3502000000}
      SIP_Id: ${SIP_Id:-35020000002000000001}
      SIP_Password: ${SIP_Password:-wvp_sip_password}
      # ZLM关联(compose内部用服务名, 无需修改)
      ZLM_HOST: zlm
      ZLM_HOOK_HOST: wvp
      # [可选] 必须与 media/config.ini 中的 api.secret 一致
      ZLM_SECRET: ${ZLM_SECRET:-su6TiedN2rVAmBbIDX0aa0QTiBJLBdcf}
      # RTP多端口范围(需在宿主机防火墙/云安全组放行)
      RTP_RANGE_START: ${RTP_RANGE_START:-30000}
      RTP_RANGE_END: ${RTP_RANGE_END:-30500}
      RecordSip: ${RecordSip:-false}
      RecordPushLive: ${RecordPushLive:-false}
    volumes:
      - ./config:/opt/wvp/config          # 配置目录(首次启动自动生成默认配置)
      - ./data/wvp:/opt/wvp/data          # H2数据库持久化
      - ./logs/wvp:/opt/wvp/logs          # WVP日志
    depends_on:
      - zlm
    networks:
      - wvp-net

  zlm:
    # ZLMediaKit 官方镜像, github action 自动构建, 与代码(master分支)保持最新状态
    image: zlmediakit/zlmediakit:master
    container_name: zlm
    restart: unless-stopped
    ports:
      - "${ZLM_HTTP:-8080}:80"                        # [播流]HTTP-FLV/fmp4/API
      - "${ZLM_HTTPS:-8443}:443"                      # [播流]HTTPS
      - "${ZLM_RTMP:-1935}:1935"                      # [推/拉流]RTMP
      - "${ZLM_RTSP:-8554}:554"                       # [推/拉流]RTSP
      - "${ZLM_RTP:-10000}:${ZLM_RTP:-10000}/tcp"     # [收流]RTP(单端口模式)
      - "${ZLM_RTP:-10000}:${ZLM_RTP:-10000}/udp"
      - "${ZLM_RTC:-8000}:8000/udp"                   # [播流]WebRTC
      - "${ZLM_SRT:-9000}:9000/udp"                   # [推/拉流]SRT
      - "${RTP_RANGE_START:-30000}-${RTP_RANGE_END:-30500}:${RTP_RANGE_START:-30000}-${RTP_RANGE_END:-30500}/tcp"  # [收流]RTP多端口模式
      - "${RTP_RANGE_START:-30000}-${RTP_RANGE_END:-30500}:${RTP_RANGE_START:-30000}-${RTP_RANGE_END:-30500}/udp"
    volumes:
      - ./media/config.ini:/conf/config.ini           # ZLM配置(含hook指向wvp)
      - ./data/zlm/record:/opt/media/bin/www/record   # 录像
      - ./logs/zlm:/opt/media/log                     # ZLM日志
    command: ['MediaServer', '-c', '/conf/config.ini', '-l', '0']
    networks:
      - wvp-net

networks:
  wvp-net:
    driver: bridge
